# yaml-language-server: $schema=https://agentgateway.dev/schema/config
mcp:
  port: 3000
  statefulMode: stateless
  failureMode: failOpen
  prefixMode: never
  policies:
    cors:
      allowOrigins:
        - "*"
      allowHeaders:
        - "*"
      exposeHeaders:
        - "Mcp-Session-Id"
  targets:
    - name: system
      mcp:
        host: http://system-tools:8000/mcp
    - name: virustotal
      mcp:
        host: http://virustotal-tools:8000/mcp
