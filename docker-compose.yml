services:
  replay:
    profiles: ["replay"]
    build: ./services/replay
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fraud}:${POSTGRES_PASSWORD:-fraud_dev_password}@postgres:5432/${POSTGRES_DB:-fraud_intelligence}
      DETECTION_URL: http://detection:8000
      REPLAY_POLICY_VERSION: ${REPLAY_POLICY_VERSION:-baseline-v1}
      REPLAY_STEP_SECONDS: ${REPLAY_STEP_SECONDS:-300}
      REPLAY_INTERVAL_SECONDS: ${REPLAY_INTERVAL_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      detection:
        condition: service_started
    networks:
      - fraud-intelligence-network

  postgres:
    image: postgres:16-alpine
    container_name: environment-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraud_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-fraud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./environment/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./environment/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
      - ./environment/tests:/workspace/environment/tests:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraud} -d ${POSTGRES_DB:-fraud_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - fraud-intelligence-network

  system-tools:
    build:
      context: ./services/system-tools
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fraud}:${POSTGRES_PASSWORD:-fraud_dev_password}@postgres:5432/${POSTGRES_DB:-fraud_intelligence}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - fraud-intelligence-network

  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.5.0
    command: ["-f", "/config/config.yaml"]
    depends_on:
      - system-tools
    ports:
      - "${AGENTGATEWAY_PORT:-3000}:3000"
    volumes:
      - ./agentgateway/config.yaml:/config/config.yaml:ro
    networks:
      - fraud-intelligence-network

  detection:
    build:
      context: ./services/detection
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fraud}:${POSTGRES_PASSWORD:-fraud_dev_password}@postgres:5432/${POSTGRES_DB:-fraud_intelligence}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${DETECTION_OPENAI_MODEL:-gpt-4.1-mini}
      DETECTION_POLICY_DIR: /app/config/policies
      DEFAULT_DETECTION_POLICY_VERSION: ${DEFAULT_DETECTION_POLICY_VERSION:-baseline-v1}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${DETECTION_PORT:-10001}:8000"
    networks:
      - fraud-intelligence-network

  system:
    build:
      context: ./services/system
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fraud}:${POSTGRES_PASSWORD:-fraud_dev_password}@postgres:5432/${POSTGRES_DB:-fraud_intelligence}
      DETECTION_URL: ${DETECTION_URL:-http://detection:8000}
      PATROL_URL: ${PATROL_URL:-http://patrol:10003}
      INVESTIGATION_URL: ${INVESTIGATION_URL:-http://investigation:8000}
      ASSOCIATION_URL: ${ASSOCIATION_URL:-http://association:10004}
      DEFAULT_DETECTION_POLICY_VERSION: ${DEFAULT_DETECTION_POLICY_VERSION:-baseline-v1}
      SCOREBOARD_CONFIG_VERSION: ${SCOREBOARD_CONFIG_VERSION:-development-v1}
      SYSTEM_EVENT_POLL_SECONDS: ${SYSTEM_EVENT_POLL_SECONDS:-5}
      SYSTEM_SCHEDULE_POLL_SECONDS: ${SYSTEM_SCHEDULE_POLL_SECONDS:-5}
      SYSTEM_WORKER_POLL_SECONDS: ${SYSTEM_WORKER_POLL_SECONDS:-2}
      SYSTEM_REMOTE_POLL_SECONDS: ${SYSTEM_REMOTE_POLL_SECONDS:-5}
      SYSTEM_REQUEST_TIMEOUT_SECONDS: ${SYSTEM_REQUEST_TIMEOUT_SECONDS:-30}
      SYSTEM_MAX_CONCURRENCY: ${SYSTEM_MAX_CONCURRENCY:-4}
    depends_on:
      postgres:
        condition: service_healthy
      patrol:
        condition: service_started
      investigation:
        condition: service_started
      association:
        condition: service_started
    ports:
      - "${SYSTEM_PORT:-10005}:10005"

  investigation:
    build:
      context: ./services/investigation
    environment:
      AGENTGATEWAY_URL: http://agentgateway:3000/mcp
      DETECTION_URL: http://detection:8000
      AGENTGATEWAY_TIMEOUT_SECONDS: ${AGENTGATEWAY_TIMEOUT_SECONDS:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      INVESTIGATION_POLICY_PATH: ${INVESTIGATION_POLICY_PATH:-config/scoreboard.development.json}
    depends_on:
      - agentgateway
    ports:
      - "${INVESTIGATION_PORT:-10002}:8000"
    networks:
      - fraud-intelligence-network
  patrol:
    build:
      context: ./services/patrol
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      AGENTGATEWAY_MCP_URL: http://agentgateway:3000/mcp
      DATABASE_URL: postgresql://${POSTGRES_USER:-fraud}:${POSTGRES_PASSWORD:-fraud_dev_password}@postgres:5432/${POSTGRES_DB:-fraud_intelligence}
      PATROL_MAX_CONCURRENCY: ${PATROL_MAX_CONCURRENCY:-2}
      PATROL_SCHEDULER_ENABLED: ${PATROL_SCHEDULER_ENABLED:-false}
      PATROL_SCHEDULER_POLL_SECONDS: ${PATROL_SCHEDULER_POLL_SECONDS:-15}
      INVESTIGATION_URL: ${INVESTIGATION_URL:-http://investigation:8000}
      INVESTIGATION_TIMEOUT_SECONDS: ${INVESTIGATION_TIMEOUT_SECONDS:-10}
      INVESTIGATION_MAX_ATTEMPTS: ${INVESTIGATION_MAX_ATTEMPTS:-3}
      SCOREBOARD_CONFIG_VERSION: ${SCOREBOARD_CONFIG_VERSION:-development-v1}
    depends_on:
      postgres:
        condition: service_healthy
      agentgateway:
        condition: service_started
      investigation:
        condition: service_started
    ports:
      - "${PATROL_PORT:-10003}:10003"
    volumes:
      - ./services/patrol/policies:/app/policies:ro
    networks:
      - fraud-intelligence-network

  association:
    build:
      context: ./services/association
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      AGENTGATEWAY_MCP_URL: http://agentgateway:3000/mcp
      DATABASE_URL: postgresql://${POSTGRES_USER:-fraud}:${POSTGRES_PASSWORD:-fraud_dev_password}@postgres:5432/${POSTGRES_DB:-fraud_intelligence}
      ASSOCIATION_MAX_CONCURRENCY: ${ASSOCIATION_MAX_CONCURRENCY:-2}
      ASSOCIATION_RESULT_URL: ${ASSOCIATION_RESULT_URL:-}
      ASSOCIATION_CALLBACK_TIMEOUT_SECONDS: ${ASSOCIATION_CALLBACK_TIMEOUT_SECONDS:-10}
      ASSOCIATION_CALLBACK_MAX_ATTEMPTS: ${ASSOCIATION_CALLBACK_MAX_ATTEMPTS:-3}
    depends_on:
      postgres:
        condition: service_healthy
      agentgateway:
        condition: service_started
    ports:
      - "${ASSOCIATION_PORT:-10004}:10004"
    volumes:
      - ./services/association/policies:/app/policies:ro
    networks:
      - fraud-intelligence-network

volumes:
  postgres-data:

networks:
  fraud-intelligence-network:
    name: fraud-intelligence-network
